<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฟอร์มการกรอกข้อมูลร้านค้า</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
    color: #1e293b;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #0f172a;
    margin-bottom: 5px;
  }
  .date-display {
    text-align: center;
    font-size: 15px;
    color: #475569;
    margin-bottom: 25px;
    padding: 10px;
    background: #e2e8f0;
    border-radius: 8px;
  }
  h2 {
    font-size: 17px;
    color: #0f172a;
    border-left: 5px solid #3b82f6;
    padding-left: 10px;
    margin-top: 30px;
    margin-bottom: 15px;
  }
  .field {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .field label {
    width: 260px;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    padding-right: 10px;
  }
  .field input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.2s, box-shadow 0.2s;
    background: #f8fafc;
  }
  .field input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    background: #fff;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 13px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  button:active { transform: scale(0.97); }
  .btn-copy {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
  }
  .btn-copy:hover { opacity: 0.9; }
  .btn-clear {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
  }
  .btn-clear:hover { opacity: 0.9; }
  .status {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #16a34a;
    font-weight: 600;
    min-height: 20px;
  }
  @media (max-width: 600px) {
    .field label { width: 100%; margin-bottom: 4px; }
    .field input[type="text"] { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>✅ แบบฟอร์มการกรอกข้อมูลร้านค้า</h1>
  <div class="date-display" id="dateDisplay">วันที่ : -</div>

  <!-- ข้อมูลลูกค้า -->
  <h2>ข้อมูลลูกค้า</h2>
  <div class="field"><label>ชื่อ-สกุล :</label><input type="text" data-key="fullname"></div>
  <div class="field"><label>ชื่อเล่น :</label><input type="text" data-key="nickname"></div>
  <div class="field"><label>เบอร์โทรลูกค้า :</label><input type="text" data-key="phone"></div>
  <div class="field"><label>ไอดี ไลน์ ลูกค้า :</label><input type="text" data-key="lineId"></div>
  <div class="field"><label>ที่อยู่ ปัจจุบันของลูกค้า :</label><input type="text" data-key="address"></div>

  <h2>ข้อมูลที่ทำงาน</h2>
  <div class="field"><label>ชื่อบริษัท/ร้าน :</label><input type="text" data-key="company"></div>
  <div class="field"><label>ที่อยู่บริษัท :</label><input type="text" data-key="companyAddress"></div>
  <div class="field"><label>เบอร์โทรติดต่อที่ทำงาน :</label><input type="text" data-key="companyPhone"></div>
  <div class="field"><label>ตำแหน่ง / หน้าที่ :</label><input type="text" data-key="position"></div>
  <div class="field"><label>เงินเดือน :</label><input type="text" data-key="salary"></div>
  <div class="field"><label>อายุการทำงาน :</label><input type="text" data-key="workAge"></div>

  <!-- อ้างอิง 1 -->
  <h2>อ้างอิง 1</h2>
  <div class="field"><label>ชื่อ - สกุล :</label><input type="text" data-key="ref1Fullname"></div>
  <div class="field"><label>ชื่อเล่น :</label><input type="text" data-key="ref1Nickname"></div>
  <div class="field"><label>เบอร์โทร :</label><input type="text" data-key="ref1Phone"></div>
  <div class="field"><label>อาชีพ :</label><input type="text" data-key="ref1Job"></div>
  <div class="field"><label>ความสัมพันธ์ :</label><input type="text" data-key="ref1Relation"></div>

  <!-- อ้างอิง 2 -->
  <h2>อ้างอิง 2</h2>
  <div class="field"><label>ชื่อ - สกุล :</label><input type="text" data-key="ref2Fullname"></div>
  <div class="field"><label>ชื่อเล่น :</label><input type="text" data-key="ref2Nickname"></div>
  <div class="field"><label>เบอร์โทร :</label><input type="text" data-key="ref2Phone"></div>
  <div class="field"><label>อาชีพ :</label><input type="text" data-key="ref2Job"></div>
  <div class="field"><label>ความสัมพันธ์ :</label><input type="text" data-key="ref2Relation"></div>

  <!-- คนค้ำ -->
  <h2>คนค้ำ</h2>
  <div class="field"><label>ชื่อ - สกุล :</label><input type="text" data-key="guarantorFullname"></div>
  <div class="field"><label>ชื่อเล่น :</label><input type="text" data-key="guarantorNickname"></div>
  <div class="field"><label>เบอร์โทร :</label><input type="text" data-key="guarantorPhone"></div>
  <div class="field"><label>อาชีพ :</label><input type="text" data-key="guarantorJob"></div>
  <div class="field"><label>รายได้ :</label><input type="text" data-key="guarantorIncome"></div>
  <div class="field"><label>ความสัมพันธ์ :</label><input type="text" data-key="guarantorRelation"></div>

  <!-- โซเชียล -->
  <h2>โซเชียลมีเดีย</h2>
  <div class="field"><label>แนบ Link Facebook / TikTok / IG :</label><input type="text" data-key="socialLink"></div>

  <!-- ข้อมูลเครื่อง -->
  <h2>ข้อมูลเครื่อง & การผ่อน</h2>
  <div class="field"><label>รุ่น & ความจุ :</label><input type="text" data-key="model"></div>
  <div class="field"><label>สีเครื่อง :</label><input type="text" data-key="color"></div>
  <div class="field"><label>มือ 1&2 (โปรดระบุ) :</label><input type="text" data-key="hand"></div>
  <div class="field"><label>เงินดาวน์ :</label><input type="text" data-key="downPayment"></div>
  <div class="field"><label>เรทผ่อน/เดือน * จำนวนงวด :</label><input type="text" data-key="installment"></div>
  <div class="field"><label>ยอดที่ร้านจัด & เรท % :</label><input type="text" data-key="shopAmount"></div>
  <div class="field"><label>ลูกค้าใช้ซิมอะไร :</label><input type="text" data-key="sim"></div>

  <!-- ปุ่ม -->
  <div class="btn-group">
    <button class="btn-copy" onclick="copyAll()">📋 คัดลอกข้อมูลทั้งหมด</button>
    <button class="btn-clear" onclick="clearAll()">🗑️ ล้างข้อมูล</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
  const STORAGE_KEY = 'shopFormData_v1';

  // ===== วันที่อัตโนมัติ (พ.ศ.) =====
  function setDate() {
    const now = new Date();
    const d = now.getDate();
    const m = now.getMonth() + 1;
    const y = now.getFullYear() + 543;
    document.getElementById('dateDisplay').textContent = `วันที่ : ${d}/${m}/${y}`;
  }
  setDate();

  // ===== โหลดข้อมูลจาก localStorage =====
  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    try {
      const data = JSON.parse(saved);
      document.querySelectorAll('input[data-key]').forEach(input => {
        const key = input.dataset.key;
        if (data[key] !== undefined) input.value = data[key];
      });
    } catch (e) { console.warn('โหลดข้อมูลไม่สำเร็จ', e); }
  }
  loadData();

  // ===== บันทึกอัตโนมัติ =====
  let saveTimer = null;
  function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const data = {};
      document.querySelectorAll('input[data-key]').forEach(input => {
        data[input.dataset.key] = input.value;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      showStatus('💾 บันทึกอัตโนมัติแล้ว');
    }, 400);
  }

  document.querySelectorAll('input[data-key]').forEach(input => {
    input.addEventListener('input', autoSave);
  });

  // ===== แสดงสถานะ =====
  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; }, 2000);
  }

  // ===== ดึงค่าตาม key =====
  function val(key) {
    const el = document.querySelector(`input[data-key="${key}"]`);
    return el ? el.value.trim() : '';
  }

  // ===== คัดลอกข้อมูลทั้งหมด (รวมหัวข้อ) =====
  function copyAll() {
    const dateText = document.getElementById('dateDisplay').textContent.replace('วันที่ : ', '');

    const text =
`✅ แบบฟอร์มการกรอกข้อมูลร้านค้า
วันที่ : ${dateText}
ชื่อ-สกุล : ${val('fullname')}
ชื่อเล่น : ${val('nickname')}
เบอร์โทรลูกค้า : ${val('phone')}
ไอดี ไลน์ ลูกค้า : ${val('lineId')}
ที่อยู่ ปัจจุบันของลูกค้า : ${val('address')}
ชื่อบริษัท/ร้าน : ${val('company')}
ที่อยู่บริษัท : ${val('companyAddress')}
เบอร์โทรติดต่อที่ทำงาน : ${val('companyPhone')}
ตำแหน่ง / หน้าที่ : ${val('position')}
เงินเดือน : ${val('salary')}
อายุการทำงาน : ${val('workAge')}

อ้างอิง 1
ชื่อ - สกุล : ${val('ref1Fullname')}
ชื่อเล่น : ${val('ref1Nickname')}
เบอร์โทร : ${val('ref1Phone')}
อาชีพ : ${val('ref1Job')}
ความสัมพันธ์ : ${val('ref1Relation')}

อ้างอิง 2
ชื่อ - สกุล : ${val('ref2Fullname')}
ชื่อเล่น : ${val('ref2Nickname')}
เบอร์โทร : ${val('ref2Phone')}
อาชีพ : ${val('ref2Job')}
ความสัมพันธ์ : ${val('ref2Relation')}

คนค้ำ
ชื่อ - สกุล : ${val('guarantorFullname')}
ชื่อเล่น : ${val('guarantorNickname')}
เบอร์โทร : ${val('guarantorPhone')}
อาชีพ : ${val('guarantorJob')}
รายได้ : ${val('guarantorIncome')}
ความสัมพันธ์ : ${val('guarantorRelation')}

แนบ Link Facebook / TikTok / IG
${val('socialLink')}

รุ่น & ความจุ : ${val('model')}
สีเครื่อง : ${val('color')}
มือ 1&2 (โปรดระบุ) : ${val('hand')}
เงินดาวน์ : ${val('downPayment')}
เรทผ่อน/เดือน * จำนวนงวด : ${val('installment')}
ยอดที่ร้านจัด & เรท % : ${val('shopAmount')}
ลูกค้าใช้ซิมอะไร : ${val('sim')}`;

    navigator.clipboard.writeText(text).then(() => {
      showStatus('✅ คัดลอกข้อมูลทั้งหมดแล้ว');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus('✅ คัดลอกข้อมูลทั้งหมดแล้ว');
    });
  }

  // ===== ล้างข้อมูล =====
  function clearAll() {
    if (!confirm('ต้องการล้างข้อมูลทั้งหมดใช่หรือไม่?')) return;
    document.querySelectorAll('input[data-key]').forEach(input => {
      input.value = '';
    });
    localStorage.removeItem(STORAGE_KEY);
    showStatus('🗑️ ล้างข้อมูลเรียบร้อย');
  }
</script>
</body>
</html>
